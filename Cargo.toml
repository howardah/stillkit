[package]
name = "stillkit"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "still"
path = "src/main.rs"

[features]
default = []
native-heic = ["heic/parallel"]

[dependencies]
clap = "4.5.45"
kamadak-exif = "0.6.1"
chrono = "0.4"
walkdir = "2"
indicatif = "0.18.4"
rayon = "1.10"
image = "0.25"
# Portable SIMD Lanczos resizing; batch parallelism remains owned by Stillkit.
fast_image_resize = { version = "6.0", default-features = false, features = ["std"] }
# Already used by image; direct access enables strict embedded-JPEG validation.
zune-core = "0.5.1"
zune-jpeg = "0.5.15"
# Published 0.1.x corrupts 4:2:2 camera images; pin upstream's chroma decoding fix.
heic = { git = "https://github.com/imazen/heic", rev = "9e7f75617fb1e62e642ee34ee1ac21a5f068ab51", default-features = false, features = ["std", "backend-rust"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
webp = "0.3.1"
rawler = "0.8"
img-parts = "0.4"
# Portable codecs; keep batch parallelism in Stillkit and omit optional perceptual loops.
# Encoder: AGPL-3.0-only/commercial; decoder: MIT/Apache-2.0.
jxl-encoder = { version = "0.3.1", default-features = false, features = ["std"] }
jxl-oxide = { version = "0.12", default-features = false, features = ["moxcms"] }
# Pure Rust ICC conversion, also used by image and the JXL decoder.
moxcms = "0.8.1"
